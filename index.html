<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>Hive Mind</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#050508;
  --panel:#0a0a12;
  --border:#1a1a2e;
  --text:#e0e0e0;
  --dim:#666;
  --accent:#00f0ff;
  --accent-dim:rgba(0,240,255,0.1);
  --green:#00ff88;
  --red:#ff2a6d;
  --font:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  height:100vh;
  width:100vw;
  overflow:hidden;
  font-size:13px;
}

/* Cosmic background */
.cosmos{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 80%,rgba(0,100,255,0.08),transparent),
    radial-gradient(ellipse 60% 40% at 80% 20%,rgba(184,41,221,0.06),transparent),
    radial-gradient(ellipse 50% 30% at 50% 50%,rgba(0,240,255,0.04),transparent),
    linear-gradient(180deg,#050508 0%,#080810 50%,#050508 100%);
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  background-image:
    radial-gradient(2px 2px at 40px 60px,rgba(255,255,255,0.15),transparent),
    radial-gradient(1px 1px at 120px 40px,rgba(0,240,255,0.1),transparent),
    radial-gradient(2px 2px at 200px 150px,rgba(255,255,255,0.1),transparent),
    radial-gradient(1px 1px at 300px 80px,rgba(184,41,221,0.08),transparent),
    radial-gradient(2px 2px at 400px 200px,rgba(0,240,255,0.06),transparent);
  background-size:500px 250px;
}

.app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}

/* Header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:rgba(5,5,8,0.8);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.logo{
  font-size:16px;
  font-weight:800;
  letter-spacing:1px;
  background:linear-gradient(135deg,#fff,#00f0ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.status{
  display:flex;
  gap:12px;
  align-items:center;
  font-family:var(--mono);
  font-size:11px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--dim);
}

.status-dot.on{
  background:var(--green);
  box-shadow:0 0 8px var(--green);
}

/* Main grid */
.main{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:8px;
  padding:8px;
  overflow:hidden;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.panel-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--dim);
}

/* PnL */
.pnl-value{
  font-size:36px;
  font-weight:800;
  color:var(--green);
  line-height:1;
  text-shadow:0 0 20px rgba(0,255,136,0.2);
}

.pnl-value.red{color:var(--red);text-shadow:0 0 20px rgba(255,42,109,0.2)}

.pnl-label{
  font-size:9px;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:2px;
  margin-top:4px;
}

.pnl-meta{
  display:flex;
  gap:16px;
  margin-top:8px;
}

.pnl-meta-item{text-align:center}
.pnl-meta-val{font-family:var(--mono);font-size:16px;font-weight:700}
.pnl-meta-lab{font-size:8px;color:var(--dim);text-transform:uppercase}

/* Chart */
canvas{width:100%;height:100%}

/* Lists */
.list{flex:1;overflow-y:auto}
.row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,0.03);
  font-size:11px;
}

.green{color:var(--green)}
.red{color:var(--red)}
.dim{color:var(--dim)}

/* Controls */
.controls{
  display:flex;
  gap:8px;
  padding:12px 16px;
  background:rgba(5,5,8,0.8);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  flex-shrink:0;
}

.btn{
  flex:1;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:var(--font);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}

.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(0.98)}

.btn.green{border-color:var(--green);color:var(--green)}
.btn.green:hover{background:rgba(0,255,136,0.1)}

.btn.red{border-color:var(--red);color:var(--red)}
.btn.red:hover{background:rgba(255,42,109,0.1)}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(5,5,8,0.9);
  backdrop-filter:blur(12px);
  z-index:1000;
  justify-content:center;
  align-items:flex-end;
}

.modal.on{display:flex}

.modal-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px 16px 0 0;
  width:100%;
  max-height:85vh;
  overflow-y:auto;
  padding:20px;
}

.modal-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:20px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

.form-row{margin-bottom:14px}
.form-label{display:block;font-size:10px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.form-input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  padding:12px;
  font-family:var(--mono);
  font-size:13px;
}

.form-input:focus{outline:none;border-color:var(--accent)}
.form-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:12px;font-family:var(--mono);font-size:13px}

.btn-full{width:100%;margin:4px 0}

/* Loading */
.loading{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:5000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity 0.5s;
}

.loading.off{opacity:0;pointer-events:none}

.loading-text{
  font-size:24px;
  font-weight:800;
  background:linear-gradient(135deg,#fff,#00f0ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:12px;
}

.loading-bar{
  width:200px;
  height:2px;
  background:var(--border);
  border-radius:2px;
  overflow:hidden;
}

.loading-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--green));
  width:0%;
  transition:width 0.3s;
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@supports(padding:max(0px)){
  .header{padding-top:max(12px,env(safe-area-inset-top))}
  .controls{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}

@media(max-width:600px){
  .main{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}
}
</style>
</head>
<body>

<div class="cosmos"></div>
<div class="stars"></div>

<div class="loading" id="load">
  <div class="loading-text">HIVE MIND</div>
  <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
</div>

<div class="modal" id="cfgModal">
  <div class="modal-box">
    <div class="modal-title">Configuration</div>
    
    <div class="form-row">
      <label class="form-label">Kalshi Key ID</label>
      <input class="form-input" id="inKeyId" placeholder="your-key-id">
    </div>
    
    <div class="form-row">
      <label class="form-label">Private Key</label>
      <textarea class="form-input" id="inKey" rows="3" placeholder="-----BEGIN RSA PRIVATE KEY-----"></textarea>
    </div>
    
    <div class="form-row">
      <label class="form-label">Mode</label>
      <select class="form-select" id="inMode">
        <option value="demo">Demo</option>
        <option value="live">Live</option>
      </select>
    </div>
    
    <div class="form-row">
      <label class="form-label">Market</label>
      <select class="form-select" id="inMkt">
        <option value="KXBTC15M">BTC 15M</option>
        <option value="KXETH15M">ETH 15M</option>
        <option value="KXSOL15M">SOL 15M</option>
        <option value="KXXRP15M">XRP 15M</option>
        <option value="KXDOGE15M">DOGE 15M</option>
        <option value="KXBTCD">BTC Hourly</option>
      </select>
    </div>
    
    <div class="form-row">
      <label class="form-label">Stop Loss %</label>
      <input class="form-input" id="inSL" type="number" value="2.5" step="0.1">
    </div>
    
    <div class="form-row">
      <label class="form-label">Take Profit %</label>
      <input class="form-input" id="inTP" type="number" value="5.0" step="0.1">
    </div>
    
    <div class="form-row">
      <label class="form-label">Position Size $</label>
      <input class="form-input" id="inSize" type="number" value="100" step="10">
    </div>
    
    <div class="form-row" style="display:flex;gap:8px">
      <button class="btn btn-full green" onclick="saveCfg()" style="flex:1">Save</button>
      <button class="btn btn-full" onclick="closeCfg()" style="flex:1">Cancel</button>
    </div>
  </div>
</div>

<div class="app">
  
  <div class="header">
    <div class="logo">HIVE MIND</div>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">OFFLINE</span>
      <span id="uptime">00:00</span>
    </div>
  </div>
  
  <div class="main">
    
    <div class="panel">
      <div class="panel-header">
        <span>Market</span>
        <span class="dim" id="countdown">--:--</span>
      </div>
      <div style="height:100%">
        <canvas id="chart"></canvas>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <span>Performance</span>
        <span class="dim" id="marketBadge">DEMO</span>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;height:100%">
        <div class="pnl-value" id="pnlDisplay">+$0.00</div>
        <div class="pnl-label">Realized P&L</div>
        <div class="pnl-meta">
          <div class="pnl-meta-item">
            <div class="pnl-meta-val" id="winRate">0%</div>
            <div class="pnl-meta-lab">Win Rate</div>
          </div>
          <div class="pnl-meta-item">
            <div class="pnl-meta-val" id="tradeCount">0</div>
            <div class="pnl-meta-lab">Trades</div>
          </div>
          <div class="pnl-meta-item">
            <div class="pnl-meta-val" id="openCount">0</div>
            <div class="pnl-meta-lab">Open</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <span>Agents</span>
        <span class="dim">100K</span>
      </div>
      <div class="list" id="agentList"></div>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <span>Trades</span>
        <span class="dim" id="tradeBadge">0</span>
      </div>
      <div class="list" id="tradeList"></div>
    </div>
    
  </div>
  
  <div class="controls">
    <button class="btn green" id="tradeBtn" onclick="toggleTrading()">START</button>
    <button class="btn" onclick="openCfg()">CONFIG</button>
    <button class="btn" onclick="syncData()">SYNC</button>
    <button class="btn red" onclick="killAll()">KILL</button>
  </div>
  
</div>

<script>

var CONFIG = {
  kalshiBase: 'https://external-api.kalshi.com/trade-api/v2',
  kalshiDemo: 'https://external-api.demo.kalshi.co/trade-api/v2',
  feeds: {
    coingecko: 'https://api.coingecko.com/api/v3',
    binance: 'https://api.binance.com/api/v3',
    xoomar: 'https://xoomar.com/api/markets'
  },
  strats: ['momentum','meanrev','arbitrage','scalp','swing','sentiment','ensemble']
};

var state = {
  trading: false,
  live: false,
  pnl: 0,
  wins: 0,
  losses: 0,
  agents: [],
  trades: [],
  positions: [],
  marketData: [],
  settings: {sl:2.5,tp:5.0,fee:0.5,size:100,mode:'demo',mkt:'KXBTC15M',keyId:'',key:''},
  feeds: {cg:false,bn:false,xm:false,ks:false},
  sentiment: {news:0,social:0,chain:0},
  ws: null,
  startTime: Date.now(),
  ctx: null
};

function init() {
  loadFromHash();
  spawnAgents();
  genData();
  setupChart();
  startLoops();
  doLoading();
}

function doLoading() {
  var bar = document.getElementById('loadingFill');
  var lay = document.getElementById('load');
  var p = 0;
  var iv = setInterval(function() {
    p += 25;
    bar.style.width = p + '%';
    if (p >= 100) {
      clearInterval(iv);
      setTimeout(function() { lay.classList.add('off'); }, 300);
    }
  }, 100);
}

function spawnAgents() {
  for (var i = 0; i < 100000; i++) {
    state.agents.push({
      id: i,
      name: 'A-' + String(i).padStart(5, '0'),
      strat: CONFIG.strats[i % CONFIG.strats.length],
      conf: Math.random(),
      intel: 0.1 + Math.random() * 0.9,
      act: 'hold',
      trades: 0,
      pnl: 0
    });
  }
}

function genData() {
  var p = 52;
  for (var i = 0; i < 60; i++) {
    var chg = (Math.sin(i / 8) * 1.5 + (Math.random() - 0.5)) / 100;
    p = Math.max(5, Math.min(95, p * (1 + chg)));
    state.marketData.push({t: Date.now() - (60 - i) * 15000, p: p});
  }
}

function setupChart() {
  var c = document.getElementById('chart');
  var r = c.parentElement.getBoundingClientRect();
  c.width = r.width * 2;
  c.height = r.height * 2;
  c.style.width = r.width + 'px';
  c.style.height = r.height + 'px';
  state.ctx = c.getContext('2d');
  state.ctx.scale(2, 2);
}

function drawChart() {
  var ctx = state.ctx, c = document.getElementById('chart');
  if (!ctx || state.marketData.length < 2) return;
  var w = c.width / 2, h = c.height / 2;
  ctx.clearRect(0, 0, w, h);
  
  var ps = state.marketData.map(function(d) { return d.p; });
  var mn = Math.min.apply(null, ps) * 0.998, mx = Math.max.apply(null, ps) * 1.002, rng = mx - mn;
  
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(0,240,255,0.3)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  for (var i = 0; i < state.marketData.length; i++) {
    var x = (i / (state.marketData.length - 1)) * w;
    var y = h - ((state.marketData[i].p - mn) / rng) * h;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  var lp = state.marketData[state.marketData.length - 1].p;
  var ly = h - ((lp - mn) / rng) * h;
  ctx.fillStyle = '#00ff88';
  ctx.beginPath(); ctx.arc(w - 6, ly, 3, 0, Math.PI * 2); ctx.fill();
}

function simulate() {
  if (state.marketData.length === 0) return;
  var lp = state.marketData[state.marketData.length - 1].p;
  var np = lp + (Math.sin(Date.now() / 12000) * 0.4 + (Math.random() - 0.5) * 1.2 + (state.sentiment.news + state.sentiment.social) * 0.15) / 100 * lp;
  state.marketData.push({t: Date.now(), p: Math.max(5, Math.min(95, np))});
  if (state.marketData.length > 60) state.marketData.shift();
  checkPos(np);
}

function checkPos(price) {
  state.positions = state.positions.filter(function(pos) {
    var chg = ((price - pos.entry) / pos.entry) * 100;
    var eff = pos.type === 'long' ? chg : -chg;
    if (eff <= -state.settings.sl) {
      var loss = -state.settings.size * (state.settings.sl / 100);
      var fee = state.settings.size * (state.settings.fee / 100) * 2;
      state.pnl += loss - fee; state.losses++;
      logTrade('STOP', pos.entry, price, loss - fee, pos.agent);
      return false;
    }
    if (eff >= state.settings.tp) {
      var profit = state.settings.size * (state.settings.tp / 100);
      var fee = state.settings.size * (state.settings.fee / 100) * 2;
      state.pnl += profit - fee; state.wins++;
      logTrade('PROFIT', pos.entry, price, profit - fee, pos.agent);
      return false;
    }
    if (Date.now() - pos.time > 12 * 60 * 1000) {
      var pnl2 = (eff / 100) * state.settings.size;
      var fee = state.settings.size * (state.settings.fee / 100) * 2;
      state.pnl += pnl2 - fee; if (pnl2 > 0) state.wins++; else state.losses++;
      logTrade('EXIT', pos.entry, price, pnl2 - fee, pos.agent);
      return false;
    }
    return true;
  });
}

function agentDecide() {
  if (!state.trading) return;
  var price = state.marketData[state.marketData.length - 1] ? state.marketData[state.marketData.length - 1].p : 50;
  var tr = calcTrend(), vol = calcVol();
  for (var i = 0; i < 6; i++) {
    var idx = Math.floor(Math.random() * 100000);
    var ag = state.agents[idx];
    ag.intel = Math.min(1, ag.intel + 0.002);
    var dec = decide(ag, tr, vol, price);
    if (dec !== 'hold') {
      ag.act = dec; ag.trades++;
      if (dec === 'buy') {
        state.positions.push({type:'long',entry:price,size:state.settings.size,time:Date.now(),agent:ag.name});
        if (state.live && state.ws) placeOrder('yes', Math.floor(state.settings.size / price), price);
      } else if (dec === 'sell') {
        state.positions.push({type:'short',entry:price,size:state.settings.size,time:Date.now(),agent:ag.name});
        if (state.live && state.ws) placeOrder('no', Math.floor(state.settings.size / (100 - price)), 100 - price);
      }
    }
  }
  setTimeout(function() { for (var i = 0; i < state.agents.length; i++) if (Math.random() > 0.99) state.agents[i].act = 'hold'; }, 2000);
}

function calcTrend() { if (state.marketData.length < 8) return 0; var r = state.marketData.slice(-8); return ((r[r.length - 1].p - r[0].p) / r[0].p) * 100; }
function calcVol() { if (state.marketData.length < 8) return 0; var p = state.marketData.slice(-8).map(function(d) { return d.p; }); var m = p.reduce(function(a, b) { return a + b; }, 0) / p.length; return Math.sqrt(p.reduce(function(a, b) { return a + Math.pow(b - m, 2); }, 0) / p.length) / m * 100; }

function decide(ag, tr, vol, price) {
  var sig = Math.random(), thr = 0.25 + ag.intel * 0.35;
  var sb = (state.sentiment.news + state.sentiment.social + state.sentiment.chain) / 3 * 0.25;
  var bs = 0, ss = 0;
  switch(ag.strat) {
    case 'momentum': bs = tr > 0 ? Math.min(1, tr / 3 + sb) : 0; ss = tr < 0 ? Math.min(1, -tr / 3 - sb) : 0; break;
    case 'meanrev': bs = tr < -1.5 ? 0.7 + sb : 0; ss = tr > 1.5 ? 0.7 - sb : 0; break;
    case 'arbitrage': bs = vol < 0.8 && tr > 0 ? 0.5 + sb : 0; ss = vol < 0.8 && tr < 0 ? 0.5 - sb : 0; break;
    case 'scalp': bs = vol > 1.5 && tr > 0 ? 0.8 + sb : 0; ss = vol > 1.5 && tr < 0 ? 0.8 - sb : 0; break;
    case 'swing': bs = tr > 2 ? 0.9 + sb : 0; ss = tr < -2 ? 0.9 - sb : 0; break;
    case 'sentiment': bs = state.sentiment.composite > 0.2 ? state.sentiment.composite : 0; ss = state.sentiment.composite < -0.2 ? -state.sentiment.composite : 0; break;
    case 'ensemble': bs = (tr > 0 ? 0.25 : 0) + (state.sentiment.composite > 0 ? state.sentiment.composite * 0.35 : 0) + (vol < 1 ? 0.15 : 0); ss = (tr < 0 ? 0.25 : 0) + (state.sentiment.composite < 0 ? -state.sentiment.composite * 0.35 : 0) + (vol < 1 ? 0.15 : 0); break;
  }
  bs *= ag.conf; ss *= ag.conf;
  if (bs > thr && sig < bs) return 'buy';
  if (ss > thr && sig < ss) return 'sell';
  return 'hold';
}

function logTrade(type, entry, exit, pnlAmt, agent) {
  var t = {type:type,entry:entry.toFixed(1),exit:exit.toFixed(1),pnl:pnlAmt.toFixed(2),ag:agent||'SYS',tm:new Date().toLocaleTimeString()};
  state.trades.unshift(t); if (state.trades.length > 20) state.trades.pop();
  renderTrades();
}

function renderAgents() {
  var d = document.getElementById('agentList');
  var active = state.agents.filter(function(a) { return a.act !== 'hold'; }).slice(0, 6);
  if (active.length === 0) { d.innerHTML = '<div class="dim" style="text-align:center;padding:20px">Waiting...</div>'; return; }
  d.innerHTML = '';
  for (var i = 0; i < active.length; i++) {
    var ag = active[i];
    var col = ag.act === 'buy' ? 'green' : ag.act === 'sell' ? 'red' : 'dim';
    var div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = '<span class="dim">' + ag.name + ' (' + ag.strat + ')</span><span class="' + col + '">' + ag.act.toUpperCase() + '</span>';
    d.appendChild(div);
  }
}

function renderTrades() {
  var d = document.getElementById('tradeList');
  if (state.trades.length === 0) { d.innerHTML = '<div class="dim" style="text-align:center;padding:20px">No trades</div>'; return; }
  d.innerHTML = '';
  for (var i = 0; i < Math.min(state.trades.length, 8); i++) {
    var t = state.trades[i];
    var win = parseFloat(t.pnl) >= 0;
    var div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = '<span class="dim">' + t.type + '</span><span class="' + (win ? 'green' : 'red') + '">' + (win ? '+' : '') + '$' + t.pnl + '</span>';
    d.appendChild(div);
  }
  document.getElementById('tradeBadge').textContent = state.trades.length;
}

function updateUI() {
  var el = document.getElementById('pnlDisplay');
  var txt = (state.pnl >= 0 ? '+' : '') + '$' + Math.abs(state.pnl).toFixed(2);
  el.textContent = txt;
  el.className = 'pnl-value' + (state.pnl < 0 ? ' red' : '');
  
  var tt = state.wins + state.losses;
  document.getElementById('winRate').textContent = tt > 0 ? ((state.wins / tt) * 100).toFixed(0) + '%' : '0%';
  document.getElementById('tradeCount').textContent = tt;
  document.getElementById('openCount').textContent = state.positions.length;
  
  var e = Math.floor((Date.now() - state.startTime) / 1000);
  var h = String(Math.floor(e / 3600)).padStart(2, '0');
  var m = String(Math.floor((e % 3600) / 60)).padStart(2, '0');
  var s = String(e % 60).padStart(2, '0');
  document.getElementById('uptime').textContent = h + ':' + m + ':' + s;
  
  var dot = document.getElementById('statusDot');
  var text = document.getElementById('statusText');
  var badge = document.getElementById('marketBadge');
  
  if (state.settings.mode === 'live' && state.ws && state.ws.readyState === 1) {
    dot.className = 'status-dot on'; text.textContent = 'LIVE'; badge.textContent = 'LIVE'; badge.className = 'green';
  } else if (state.trading) {
    dot.className = 'status-dot on'; text.textContent = 'DEMO'; badge.textContent = 'DEMO'; badge.className = 'dim';
  } else {
    dot.className = 'status-dot'; text.textContent = 'OFFLINE'; badge.textContent = 'OFF'; badge.className = 'dim';
  }
  
  if (state.settings.mkt.indexOf('15M') !== -1) {
    var now = new Date();
    var rm = 14 - (now.getMinutes() % 15);
    var rs = 59 - now.getSeconds();
    document.getElementById('countdown').textContent = String(rm).padStart(2, '0') + ':' + String(rs).padStart(2, '0');
  } else { document.getElementById('countdown').textContent = '--:--'; }
}

function tryFetch(url, opts, to) {
  return new Promise(function(resolve, reject) {
    var ctrl = new AbortController();
    var t = setTimeout(function() { ctrl.abort(); reject(new Error('timeout')); }, to || 3000);
    fetch(url, Object.assign({}, opts || {}, {signal:ctrl.signal}))
      .then(function(r) { clearTimeout(t); resolve(r); })
      .catch(function(e) { clearTimeout(t); reject(e); });
  });
}

function fetchFeeds() {
  tryFetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd', {}, 2500)
    .then(function(r) { if (r.ok) { state.feeds.cg = true; return r.json(); } })
    .then(function(d) { if (d && d.bitcoin && d.bitcoin.usd) { state.sentiment.chain = Math.max(-1, Math.min(1, ((d.bitcoin.usd / 65000) - 1) * 100 / 10)); } })
    .catch(function() { state.feeds.cg = false; });
  
  tryFetch('https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT', {}, 2500)
    .then(function(r) { if (r.ok) state.feeds.bn = true; })
    .catch(function() { state.feeds.bn = false; });
  
  tryFetch('https://xoomar.com/api/markets/sentiment/btc', {}, 2500)
    .then(function(r) { if (r.ok) { state.feeds.xm = true; return r.json(); } })
    .then(function(d) { if (d && d.data) { state.sentiment.news = parseFloat(d.data.newsScore) || 0; state.sentiment.social = parseFloat(d.data.crowdScore) || 0; } })
    .catch(function() { state.feeds.xm = false; });
  
  tryFetch('https://external-api.kalshi.com/trade-api/v2/markets?series_ticker=' + state.settings.mkt + '&status=open&limit=3', {}, 3000)
    .then(function(r) { if (r.ok) { state.feeds.ks = true; return r.json(); } })
    .then(function(d) { if (d && d.markets && d.markets[0]) { var p = parseFloat(d.markets[0].last_price_dollars) * 100; if (p > 0 && p < 100) state.marketData[state.marketData.length - 1].p = p; } })
    .catch(function() { state.feeds.ks = false; });
}

async function signRequest(method, path, body) {
  if (!state.settings.key || !state.settings.keyId) return null;
  try {
    var timestamp = Math.floor(Date.now() / 1000).toString();
    var msg = timestamp + method + path + (body ? JSON.stringify(body) : '');
    var pem = state.settings.key.replace('-----BEGIN RSA PRIVATE KEY-----', '').replace('-----END RSA PRIVATE KEY-----', '').replace(/\s/g, '');
    var binary = atob(pem);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var cryptoKey = await crypto.subtle.importKey('pkcs8', bytes.buffer, {name:'RSA-PSS', hash:'SHA-256'}, false, ['sign']);
    var signature = await crypto.subtle.sign({name:'RSA-PSS', saltLength:32}, cryptoKey, new TextEncoder().encode(msg));
    var sigBase64 = btoa(String.fromCharCode.apply(null, new Uint8Array(signature)));
    return {timestamp:timestamp, signature:sigBase64};
  } catch(e) { return null; }
}

async function placeOrder(side, count, price) {
  var action = state.settings.mode === 'demo' ? 'DEMO' : 'LIVE';
  console.log(action + ' ORDER: ' + side + ' ' + count + ' @ ' + price.toFixed(1));
  if (state.settings.mode === 'demo') return;
  var base = state.settings.mode === 'demo' ? CONFIG.kalshiDemo : CONFIG.kalshiBase;
  var path = '/portfolio/orders';
  var body = {ticker:state.settings.mkt, side:side, action:'buy', count:count, yes_price:Math.round(price), time_in_force:'good_till_canceled'};
  var sig = await signRequest('POST', path, body);
  if (!sig) { console.log('SIGN FAILED'); state.settings.mode = 'demo'; state.live = false; updateUI(); return; }
  try {
    var res = await fetch(base + path, {method:'POST', headers:{'Content-Type':'application/json', 'KALSHI-ACCESS-KEY':state.settings.keyId, 'KALSHI-ACCESS-TIMESTAMP':sig.timestamp, 'KALSHI-ACCESS-SIGNATURE':sig.signature}, body:JSON.stringify(body)});
    if (res.ok) { var data = await res.json(); console.log('ORDER FILLED'); return data; }
    else { var err = await res.text(); console.log('ORDER FAILED: ' + err.substring(0,50)); }
  } catch(e) { console.log('NETWORK ERROR: ' + e.message); }
}

function connectWS() {
  if (state.ws) return;
  var url = state.settings.mode === 'demo' ? 'wss://external-api.demo.kalshi.co/trade-api/ws/v2' : 'wss://external-api.kalshi.com/trade-api/ws/v2';
  try {
    state.ws = new WebSocket(url);
    state.ws.onopen = function() { console.log('WS connected'); };
    state.ws.onmessage = function(e) { try { var m = JSON.parse(e.data); } catch(err) {} };
    state.ws.onclose = function() { state.ws = null; };
    state.ws.onerror = function() { state.ws = null; };
  } catch(e) {}
}

function toggleTrading() {
  state.trading = !state.trading;
  var btn = document.getElementById('tradeBtn');
  if (state.trading) {
    btn.textContent = 'STOP';
    btn.className = 'btn red';
  } else {
    btn.textContent = 'START';
    btn.className = 'btn green';
  }
}

function killAll() {
  state.trading = false;
  state.positions = [];
  var btn = document.getElementById('tradeBtn');
  btn.textContent = 'START';
  btn.className = 'btn green';
}

function syncData() { fetchFeeds(); }

function loadFromHash() {
  try {
    var hash = window.location.hash.slice(1);
    if (!hash) return;
    var parts = hash.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      if (kv.length !== 2) continue;
      var k = decodeURIComponent(kv[0]);
      var v = decodeURIComponent(kv[1]);
      if (k === 'keyId') state.settings.keyId = v;
      if (k === 'mode') state.settings.mode = v;
      if (k === 'market') state.settings.mkt = v;
      if (k === 'sl') state.settings.sl = parseFloat(v) || 2.5;
      if (k === 'tp') state.settings.tp = parseFloat(v) || 5.0;
      if (k === 'size') state.settings.size = parseFloat(v) || 100;
      if (k === 'fee') state.settings.fee = parseFloat(v) || 0.5;
    }
  } catch(e) {}
}

function saveToHash() {
  try {
    var parts = [];
    if (state.settings.keyId) parts.push('keyId=' + encodeURIComponent(state.settings.keyId));
    parts.push('mode=' + encodeURIComponent(state.settings.mode));
    parts.push('market=' + encodeURIComponent(state.settings.mkt));
    parts.push('sl=' + state.settings.sl);
    parts.push('tp=' + state.settings.tp);
    parts.push('size=' + state.settings.size);
    parts.push('fee=' + state.settings.fee);
    window.history.replaceState(null, null, '#' + parts.join('&'));
  } catch(e) {}
}

function openCfg() { document.getElementById('cfgModal').classList.add('on'); }
function closeCfg() { document.getElementById('cfgModal').classList.remove('on'); }

function saveCfg() {
  state.settings.sl = parseFloat(document.getElementById('inSL').value) || 2.5;
  state.settings.tp = parseFloat(document.getElementById('inTP').value) || 5.0;
  state.settings.size = parseFloat(document.getElementById('inSize').value) || 100;
  state.settings.fee = parseFloat(document.getElementById('inFee').value) || 0.5;
  state.settings.mode = document.getElementById('inMode').value;
  state.settings.mkt = document.getElementById('inMkt').value;
  state.settings.keyId = document.getElementById('inKeyId').value;
  state.settings.key = document.getElementById('inKey').value;
  state.live = state.settings.mode === 'live';
  saveToHash();
  if (state.settings.key) connectWS();
  closeCfg();
}

function startLoops() {
  setInterval(simulate, 3000);
  setInterval(agentDecide, 2500);
  setInterval(updateUI, 1000);
  setInterval(drawChart, 100);
  setInterval(renderAgents, 2000);
  setInterval(fetchFeeds, 10000);
}

var lastTouchEnd = 0;
document.addEventListener('touchend', function(e) { var now = Date.now(); if (now - lastTouchEnd <= 300) e.preventDefault(); lastTouchEnd = now; }, false);
document.body.style.overscrollBehavior = 'none';

window.onload = function() { init(); };

</script>
