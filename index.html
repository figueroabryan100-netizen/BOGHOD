@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{--bg:#050508;--panel:#0a0a12;--border:#1a1a2e;--text:#e0e0e0;--dim:#666;--accent:#00f0ff;--green:#00ff88;--red:#ff2a6d;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;width:100vw;overflow:hidden;font-size:13px}

.cosmos{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 50% at 20% 80%,rgba(0,100,255,0.08),transparent),radial-gradient(ellipse 60% 40% at 80% 20%,rgba(184,41,221,0.06),transparent),radial-gradient(ellipse 50% 30% at 50% 50%,rgba(0,240,255,0.04),transparent),linear-gradient(180deg,var(--bg) 0%,#080810 50%,var(--bg) 100%)}

.stars{position:fixed;inset:0;pointer-events:none;z-index:1;background-image:radial-gradient(2px 2px at 40px 60px,rgba(255,255,255,0.15),transparent),radial-gradient(1px 1px at 120px 40px,rgba(0,240,255,0.1),transparent),radial-gradient(2px 2px at 200px 150px,rgba(255,255,255,0.1),transparent),radial-gradient(1px 1px at 300px 80px,rgba(184,41,221,0.08),transparent),radial-gradient(2px 2px at 400px 200px,rgba(0,240,255,0.06),transparent);background-size:500px 250px}

.app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column}

.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(5,5,8,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}

.logo{font-size:16px;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.status{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:11px}

.status-dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.status-dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}

.main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;overflow:hidden}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;overflow:hidden}

.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}

.pnl-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-top:4px}

.pnl-meta{display:flex;gap:16px;margin-top:8px;font-size:11px}.pnl-meta-item{text-align:center}.pnl-meta-val{font-family:var(--mono);font-size:16px;font-weight:700}.pnl-meta-lab{font-size:8px;color:var(--dim);text-transform:uppercase}

canvas{width:100%;height:100%}

.list{flex:1;overflow-y:auto}.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px}.row:hover{background:rgba(255,255,255,0.02)}

.green{color:var(--green)}.red{color:var(--red)}.dim{color:var(--dim)}

.controls{display:flex;gap:8px;padding:12px 16px;background:rgba(5,5,8,0.8);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0}
